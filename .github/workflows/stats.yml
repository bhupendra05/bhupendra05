name: Generate Empire Dashboard

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (fresh data every morning)
  push:
    branches: [main]       # also runs the moment this file is pushed → instant first run
  workflow_dispatch:        # manual trigger from the Actions tab

# A delayed scheduled run and a push-triggered run can otherwise overlap, and both would try
# to commit + push at the end — the loser gets a non-fast-forward rejection. Only one run at a
# time; a newer trigger (e.g. another push) cancels an in-flight one rather than queuing behind it.
concurrency:
  group: empire-dashboard
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # backstop only — the script enforces its own ~8min soft deadline
    permissions:
      contents: write

    steps:
      # Default GITHUB_TOKEN — scoped to just this repo, but that's all checkout/push need.
      # It's what makes the later `git push` work (via permissions.contents:write above),
      # without any manual remote-URL credential rewriting.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PAT_1 stays here ONLY: gen_stats.py queries account-wide data (contributionsCollection,
      # stargazers-with-timestamp, watchers, and 14-day traffic across ALL repos) that the
      # per-repo GITHUB_TOKEN can't see.
      - name: Generate empire dashboard (stats + intel)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_1 }}
          GITHUB_LOGIN: bhupendra05
        run: python scripts/gen_stats.py

      - name: Commit and push (if changed)
        run: |
          git config user.name "Bhupendra Tale"
          git config user.email "bgurjar05.bg@gmail.com"
          git add assets/stats.svg assets/intel.svg data/history.json data/dashboard.json
          git diff --staged --quiet && echo "no changes" || (git commit -m "chore: refresh empire dashboard [skip ci]" && git push)
