<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-label="GitHub stats for bhupendra05">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d0221"/>
    <stop offset="1" stop-color="#150928"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#05d9e8"/>
    <stop offset="0.5" stop-color="#ff2a6d"/>
    <stop offset="1"   stop-color="#a64dff"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- background + border -->
<rect width="720" height="210" rx="12" fill="url(#bg)"/>
<rect width="720" height="210" rx="12" fill="none" stroke="url(#border)" stroke-width="1.5" opacity="0.85"/>

<!-- title bar -->
<line x1="20" y1="44" x2="700" y2="44" stroke="url(#border)" stroke-width="0.8" opacity="0.5"/>
<text x="20" y="30" font-size="12.5" font-weight="700" fill="#05d9e8"
  font-family="JetBrains Mono,Courier New,monospace" letter-spacing="3">▲ BHUPENDRA05 // GITHUB STATS</text>

<!-- corner brackets -->
<path d="M8 8 h20 M8 8 v20"   stroke="#05d9e8" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M712 8 h-20 M712 8 v20"     stroke="#05d9e8" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M8 202 h20 M8 202 v-20"     stroke="#a64dff" stroke-width="2" fill="none" opacity="0.7"/>
<path d="M712 202 h-20 M712 202 v-20" stroke="#a64dff" stroke-width="2" fill="none" opacity="0.7"/>

<!-- dividers -->
<line x1="248" y1="48" x2="248" y2="196" stroke="#05d9e8" stroke-width="0.6" opacity="0.18"/><line x1="492" y1="48" x2="492" y2="196" stroke="#05d9e8" stroke-width="0.6" opacity="0.18"/><line x1="24" y1="118" x2="696" y2="118" stroke="#ff2a6d" stroke-width="0.6" opacity="0.18"/>

<!-- stat cells -->
<text x="30" y="72" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">⭐  TOTAL STARS</text>
<text x="30" y="106" font-size="30" font-weight="800" fill="#ffd700" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">19</text>
  <text x="270" y="72" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">🔥  COMMITS / YEAR</text>
<text x="270" y="106" font-size="30" font-weight="800" fill="#ff2a6d" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">44</text>
  <text x="510" y="72" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">📦  PUBLIC REPOS</text>
<text x="510" y="106" font-size="30" font-weight="800" fill="#05d9e8" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">166</text>
  <text x="30" y="150" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">🔀  PULL REQUESTS</text>
<text x="30" y="184" font-size="30" font-weight="800" fill="#a64dff" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">2</text>
  <text x="270" y="150" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">👥  FOLLOWERS</text>
<text x="270" y="184" font-size="30" font-weight="800" fill="#05d9e8" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">77</text>
  <text x="510" y="150" font-size="10.5" fill="#8b949e" font-family="JetBrains Mono,Courier New,monospace" letter-spacing="1.2">🏆  TOP LANGUAGE</text>
<text x="510" y="184" font-size="30" font-weight="800" fill="#ff2a6d" font-family="JetBrains Mono,Courier New,monospace" filter="url(#glow)">Python</text>
</svg>